name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - feat/fexxa-website-4860374102184618848

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync build to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_BUCKET_NAME }} --delete

      - name: Upload clean URL aliases for HTML pages
        run: |
          cd out
          find . -name "*.html" ! -name "index.html" ! -name "404.html" -type f | while read file; do
            key="${file#./}"
            alias="${key%.html}"
            echo "Creating alias: $alias"
            aws s3api put-object \
              --bucket "${{ secrets.AWS_BUCKET_NAME }}" \
              --key "$alias" \
              --body "$file" \
              --content-type "text/html"
          done

      - name: Verify product pages in S3
        run: |
          echo "Verifying product page keys exist..."
          for key in producto/remodelaciones/1 producto/remodelaciones/2 producto/remodelaciones/3 producto/mobiliario/1 producto/mobiliario/2 producto/mobiliario/3; do
            if aws s3api head-object --bucket "${{ secrets.AWS_BUCKET_NAME }}" --key "$key" 2>/dev/null; then
              echo "OK: $key"
            else
              echo "MISSING: $key"
              exit 1
            fi
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
