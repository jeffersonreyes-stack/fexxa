name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - feat/fexxa-website-4860374102184618848

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync build to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_BUCKET_NAME }} --delete

      - name: Upload clean URL aliases for HTML pages
        run: |
          cd out
          find . -name "*.html" ! -name "index.html" ! -name "404.html" | while read file; do
            key="${file#./}"
            alias="${key%.html}"
            echo "Uploading alias: $alias"
            aws s3 cp "$file" "s3://${{ secrets.AWS_BUCKET_NAME }}/$alias" \
              --content-type "text/html" \
              --metadata-directive REPLACE
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
